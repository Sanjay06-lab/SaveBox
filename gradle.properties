# Project-wide Gradle settings.

# Memory for the Gradle daemon. Increase if builds run out of memory.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# Reuse outputs of previous builds to make builds faster.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Use AndroidX libraries.
android.useAndroidX=true

# Each module's R class only contains its own resources (smaller, faster builds).
android.nonTransitiveRClass=true

# Kotlin code style used by Android Studio's formatter.
kotlin.code.style=official
